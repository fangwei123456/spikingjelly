<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 605" role="img" aria-labelledby="title">
  <title id="title">Installation choices / 安装方式</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker></defs>
  <rect width="960" height="100%" fill="#fff"/>
  <g font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" text-anchor="middle" fill="#17283b">
    <path d="M480 90 V130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M310 165 H165 V240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="180" y="215" font-size="14">CPU</text>
    <path d="M650 165 H670 V240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="738" y="215" font-size="14">NVIDIA CUDA</text>
    <path d="M670 320 V365 H160 V410" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="210" y="395" font-size="14">None / 无</text>
    <path d="M670 365 H480 V410" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="520" y="395" font-size="14">Triton</text>
    <path d="M670 365 H800 V410" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="855" y="395" font-size="14">Native / 原生</text>
    <rect x="230" y="20" width="500" height="70" rx="10" fill="#eaf2ff" stroke="#94a3b8"/>
    <text x="480" y="49" font-size="18">Python ≥ 3.11 + appropriate Torch ≥ 2.6</text>
    <text x="480" y="73" font-size="16">准备 Python 和适合设备的 Torch</text>
    <rect x="310" y="130" width="340" height="70" rx="10" fill="#fff3d6" stroke="#94a3b8"/>
    <text x="480" y="171" font-size="19">Device / 运行设备</text>
    <rect x="25" y="240" width="280" height="90" rx="10" fill="#edf7ee" stroke="#94a3b8"/>
    <text x="165" y="279" font-size="16">CPU: regular install / 普通安装</text>
    <text x="165" y="303" font-size="15">uv pip install spikingjelly</text>
    <rect x="420" y="240" width="500" height="80" rx="10" fill="#fff3d6" stroke="#94a3b8"/>
    <text x="670" y="274" font-size="19">CUDA acceleration is optional</text>
    <text x="670" y="298" font-size="16">CUDA 加速按需准备</text>
    <rect x="10" y="410" width="300" height="110" rx="10" fill="#edf7ee" stroke="#94a3b8"/>
    <text x="160" y="459" font-size="17">Torch reference / 参考实现</text>
    <text x="160" y="483" font-size="15">uv pip install spikingjelly</text>
    <rect x="330" y="410" width="300" height="110" rx="10" fill="#eaf2ff" stroke="#94a3b8"/>
    <text x="480" y="447" font-size="17">Optional Triton / 可选 Triton</text>
    <text x="480" y="471" font-size="15">uv pip install</text>
    <text x="480" y="495" font-size="15">&quot;spikingjelly[triton]&quot;</text>
    <rect x="650" y="410" width="300" height="110" rx="10" fill="#eaf2ff" stroke="#94a3b8"/>
    <text x="800" y="447" font-size="18">Native CUDA / 原生 CUDA</text>
    <text x="800" y="471" font-size="15">Prepare toolkit + compiler</text>
    <text x="800" y="495" font-size="15">准备工具链后手动构建 sdist</text>
    <text x="480" y="561" font-size="15">Triton and native CUDA can coexist.</text>
    <text x="480" y="585" font-size="15">Triton 与原生 CUDA 可以同时安装。</text>
  </g>
</svg>
