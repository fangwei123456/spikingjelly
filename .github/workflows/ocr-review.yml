# OpenCodeReview PR review for high-confidence, actionable findings.

name: OpenCodeReview PR Review

concurrency:
  # Do not let an unrelated PR comment cancel an active review.
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && startsWith(github.event.comment.body, '/ocr')
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && startsWith(github.event.comment.body, '/ocr')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve PR refs
        if: github.event_name == 'issue_comment'
        id: pr-context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@8d023aafcec05f8ba5628fca3eaba88078e5d201 # v1.11.1
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ secrets.OCR_LLM_MODEL }}
          llm_use_anthropic: 'false'
          llm_extra_body: '{"thinking":{"type":"adaptive"},"reasoning_split":true}'
          background: |
            Review SpikingJelly with precision over recall.
            Report only concrete, current, user-observable defects, security or data-loss risks, substantial measured regressions, or violations of an explicit project contract. Every finding must name one trigger, one consequence, and one primary fix.
            Do not report standalone style, naming, formatting, unused imports, shadowing, comments, docstrings, help text, refactoring, idiomatic alternatives, or extra tests/docs unless they cause a concrete behavior change or violate an explicit repository requirement.
            Do not speculate about future callers or APIs, unsupported hardware or versions, malformed inputs outside the supported contract, unmeasured micro-optimizations, intentional strictness, documented invariants, fixed benchmark scope, or fail-fast behavior.
            For examples, benchmarks, tests, plots, and generated results, report only issues that break CI, invalidate a measurement, corrupt an artifact, or change documented user-facing behavior. Emit one finding per root cause and stay silent when evidence is inconclusive.
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          ocr_version: '1.11.1'
          node_version: '24.19.0'
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'true'
          route_severity_below: 'low'
          route_categories: 'style,documentation'
