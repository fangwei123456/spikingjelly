name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: CPU tests and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.24"
          enable-cache: true
          cache-dependency-glob: .github/ci-constraints.txt

      - name: Install CPU test environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.11
          uv pip install --python .venv/bin/python \
            torch==2.7.1 torchvision==0.22.1 torchaudio==2.7.1 \
            --constraints .github/ci-constraints.txt \
            --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python --editable . --group dev \
            --constraints .github/ci-constraints.txt \
            --build-constraints .github/ci-constraints.txt

      - name: Check formatting
        run: uv format --check --version 0.15.22

      - name: Run Ruff lint
        run: uvx ruff==0.15.22 check .

      - name: Run CPU tests
        run: uv run --no-sync pytest test/ -q

      - name: Build documentation without warnings
        run: uv run --no-sync sphinx-build -M html docs/source docs/build -W --keep-going

  package:
    name: Package install smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.24"

      - name: Build distributions
        run: uv build --out-dir dist --build-constraints .github/ci-constraints.txt

      - name: Check pure Python artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          models = [source.parent.name for source in Path("ops").glob("*/native.cu")]
          assert models
          assert wheel.name.endswith("-py3-none-any.whl"), wheel
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert "spikingjelly/_ops/__init__.py" in names
              for model in models:
                  assert f"spikingjelly/_ops/{model}/__init__.py" in names
                  assert f"spikingjelly/_ops/{model}/kernels.cuh" in names
              assert "spikingjelly/_ops/_cuda.cuh" in names
              assert not any(
                  name.endswith((".so", ".pyd", "_native_build.json")) for name in names
              )
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              for model in models:
                  assert any(
                      name.endswith(f"/ops/{model}/native.cu") for name in archive.getnames()
                  )
          PY

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          package_venv="$(mktemp -d)"
          uv venv --python 3.11 "$package_venv"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python "$package_venv/bin/python" "$wheel" --no-deps
          cd "$(mktemp -d)"
          "$package_venv/bin/python" - <<'PY'
          import importlib.util
          import sys
          import spikingjelly
          import spikingjelly._ops

          for model in ("lif", "if_", "plif"):
              assert importlib.util.find_spec(f"spikingjelly._ops.{model}") is not None
          assert "torch" not in sys.modules
          PY

      - name: Check editable mapping outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          package_venv="$(mktemp -d)"
          uv venv --python 3.11 "$package_venv"
          uv pip install --python "$package_venv/bin/python" --editable . --no-deps \
            --build-constraints .github/ci-constraints.txt
          cd "$(mktemp -d)"
          "$package_venv/bin/python" - <<'PY'
          import importlib.util
          import sys
          import spikingjelly
          import spikingjelly._ops

          for model in ("lif", "if_", "plif"):
              assert importlib.util.find_spec(f"spikingjelly._ops.{model}") is not None
          assert "torch" not in sys.modules
          PY
