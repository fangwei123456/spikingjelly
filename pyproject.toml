[build-system]
requires = [
    "setuptools>=77.0.3",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spikingjelly*"]

[project]
name = "spikingjelly"
version = "2.0.0rc1"
description = "A deep learning framework for SNNs built on PyTorch."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "PKU MLG, PCL, and other contributors"},
    {email = "fwei@pku.edu.cn"},
    {email = "chyq@pku.edu.cn"},
    {email = "yfhuang@pku.edu.cn"}
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "torchvision",
    "torchaudio",
    "h5py",
    "loguru>=0.7,<1",
    "matplotlib",
    "numpy",
    "packaging",
    "requests",
    "SciencePlots",
    "scipy",
    "tensorboard",
    "tqdm",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
license-files = ["LICENSE", "LICENSES/README.md", "LICENSES/translations/*"]

[project.optional-dependencies]
cupy11 = ["cupy-cuda11x"]
cupy12 = ["cupy-cuda12x"]
triton = ["triton>=3.3.1"]
nir = ["nir>=1.0.7,<2", "nirtorch>=2.6,<2.7"]
lightning = ["lightning", "jsonargparse[signatures]"]
megatron = ["megatron-core==0.18.2; python_version >= '3.12'"]
sglang = [
    "flash-attn-4==4.0.0b19; sys_platform == 'linux'",
    "sglang==0.5.17; sys_platform == 'linux'",
]
sglang-export = ["safetensors"]
fp8-torchao = [
    "torchao>=0.13,<0.18",
]
fp8-te = [
    "transformer-engine[pytorch]>=2.16,<3",
]
qwen = [
    "transformers==5.13.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx>=8.0.0,<9",
]
llm-benchmark = [
    "datasets>=5,<6",
    "lm-eval[hf]==0.4.12",
]

[tool.uv]
conflicts = [
    [
        {extra = "qwen"},
        {extra = "sglang"},
    ],
]

[project.urls]
Homepage = "https://github.com/fangwei123456/spikingjelly"
Documentation = "https://spikingjelly.readthedocs.io/"
License = "https://github.com/fangwei123456/spikingjelly/blob/master/LICENSE"

[tool.ruff]
src = ["spikingjelly", "test"]
exclude = ["*.ipynb"]
line-length = 88

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
ignore = ["E402", "E731", "E741", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["benchmark", "spikingjelly", "test"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.coverage.run]
branch = true
omit = [
    "*/examples/*",
]
source = ["spikingjelly"]

[tool.coverage.report]
show_missing = true
